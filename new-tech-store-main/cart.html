<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volt Tech - Корзина</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=19">
</head>

<body>
    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <img src="img/logo.png" alt="TechStore" class="logo-icon-img">
                Volt Tech
            </a>
            <nav>
                <ul class="flex gap-4">
                    <li><a href="index.html" class="nav-link">Главная</a></li>
                    <li><a href="catalog.html" class="nav-link">Каталог</a></li>
                    <li><a href="builds.html" class="nav-link">Сборки</a></li>
                </ul>
            </nav>
            <div class="flex items-center gap-4">
                <a href="auth.html" class="nav-link">Войти</a>
                <a href="cart.html" class="cart-btn">
                    🛒
                    <span class="cart-badge" id="cart-count">0</span>
                </a>
            </div>
        </div>
    </header>

    <div class="container cart-page" style="padding-bottom: 4rem;">
        <h1 style="margin-bottom: 1.5rem;">Корзина покупок</h1>

        <div class="cart-grid">
            <!-- Список товаров -->
            <div class="cart-items" id="cart-items-container">
                <p>Ваша корзина пуста.</p>
            </div>

            <!-- Итоги и промокоды -->
            <div class="cart-summary">
                <div class="glass-panel" style="padding: 2rem;">
                    <h2 style="margin-bottom: 1.25rem;">Итоги заказа</h2>

                    <!-- Блок промокода -->
                    <div style="margin-bottom: 1.5rem;">
                        <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.5rem;">
                            🎟️ Промокод на скидку
                        </label>
                        <div class="flex gap-1">
                            <input type="text" id="promo-code-input" class="form-input" placeholder="Например: VOLT10" style="padding: 10px 14px; text-transform: uppercase;">
                            <button type="button" class="btn btn-outline btn-sm" onclick="window.applyPromoCode()" style="white-space: nowrap;">Применить</button>
                        </div>

                        <!-- Активный промокод -->
                        <div id="active-promo-pill" style="display: none; margin-top: 0.75rem; padding: 8px 12px; border-radius: 10px; background: rgba(0, 255, 128, 0.12); border: 1px solid rgba(0, 255, 128, 0.3); justify-content: space-between; align-items: center;">
                            <span id="active-promo-label" style="font-size: 0.85rem; color: #00ff80; font-weight: 600;"></span>
                            <button type="button" onclick="window.removePromoCode()" style="background: transparent; border: none; color: #ff4d88; cursor: pointer; font-weight: bold;">✕</button>
                        </div>
                    </div>

                    <div class="flex justify-between" style="margin-bottom: 0.75rem;">
                        <span style="color: var(--text-secondary);">Сумма товаров</span>
                        <span id="cart-subtotal">0.00 сом</span>
                    </div>

                    <div class="flex justify-between" id="cart-promo-discount-row" style="margin-bottom: 0.75rem; display: none; color: #00ff80;">
                        <span id="cart-promo-discount-label">Скидка по промокоду</span>
                        <span id="cart-promo-discount-val">-0.00 сом</span>
                    </div>

                    <div class="flex justify-between" style="margin-bottom: 1rem;">
                        <span style="color: var(--text-secondary);">Доставка</span>
                        <span style="color: var(--accent-primary);">Бесплатно</span>
                    </div>

                    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 1.25rem 0;">

                    <div class="flex justify-between"
                        style="margin-bottom: 1.75rem; font-size: 1.3rem; font-weight: 800;">
                        <span>Итого к оплате</span>
                        <span id="cart-total" style="color: var(--accent-primary);">0.00 сом</span>
                    </div>

                    <button class="btn btn-primary" style="width: 100%;">Перейти к оформлению</button>
                    <div class="text-center" style="margin-top: 1rem;">
                        <a href="catalog.html" style="font-size: 0.9rem; color: var(--text-secondary);">или Продолжить
                            покупки</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/api.js"></script>
    <script type="module" src="js/main.js"></script>
</body>

</html>
