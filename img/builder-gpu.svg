<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGradGpu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111522"/>
      <stop offset="100%" stop-color="#090b12"/>
    </linearGradient>
    <linearGradient id="shroudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262d45"/>
      <stop offset="50%" stop-color="#181c2c"/>
      <stop offset="100%" stop-color="#0f121d"/>
    </linearGradient>
    <linearGradient id="rgbAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7b2cbf"/>
      <stop offset="100%" stop-color="#ff006e"/>
    </linearGradient>
    <filter id="gpuGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="24" fill="url(#bgGradGpu)"/>

  <!-- Задняя планка I/O bracket -->
  <path d="M16 48 H24 V156 H16" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round"/>

  <!-- Медные теплотрубки сверху -->
  <path d="M45 56 H165 M55 52 H145" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>

  <!-- Корпус видеокарты -->
  <rect x="22" y="58" width="162" height="78" rx="10" fill="url(#shroudGrad)" stroke="#3b4566" stroke-width="2"/>

  <!-- Верхняя RGB-полоса -->
  <rect x="34" y="63" width="138" height="4" rx="2" fill="url(#rgbAccent)" filter="url(#gpuGlow)"/>

  <!-- Вентилятор 1 (левый) -->
  <g transform="translate(62, 98)">
    <circle cx="0" cy="0" r="28" fill="#0b0d14" stroke="#00f0ff" stroke-width="1.5"/>
    <path d="M0 -26 C8 -16, 12 -8, 0 0 C16 -8, 24 -4, 26 0 C16 8, 8 12, 0 0 C8 16, 4 24, 0 26 C-8 16, -12 8, 0 0 C-16 8, -24 4, -26 0 C-16 -8, -8 -12, 0 0" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="8" fill="#1f2937" stroke="#00f0ff" stroke-width="1.5"/>
  </g>

  <!-- Вентилятор 2 (правый) -->
  <g transform="translate(136, 98)">
    <circle cx="0" cy="0" r="28" fill="#0b0d14" stroke="#ff006e" stroke-width="1.5"/>
    <path d="M0 -26 C8 -16, 12 -8, 0 0 C16 -8, 24 -4, 26 0 C16 8, 8 12, 0 0 C8 16, 4 24, 0 26 C-8 16, -12 8, 0 0 C-16 8, -24 4, -26 0 C-16 -8, -8 -12, 0 0" fill="#1e293b" stroke="#f43f5e" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="8" fill="#1f2937" stroke="#ff006e" stroke-width="1.5"/>
  </g>

  <!-- Разъем PCIe снизу (золотые контакты) -->
  <rect x="44" y="136" width="88" height="10" rx="2" fill="#064e3b"/>
  <line x1="48" y1="141" x2="128" y2="141" stroke="#fbbf24" stroke-width="6" stroke-dasharray="3 2"/>

  <!-- Декоративные кибер-линии на кожухе -->
  <path d="M94 70 L104 82 L94 94 M104 102 L94 114 L104 126" stroke="url(#rgbAccent)" stroke-width="2" fill="none"/>
</svg>
