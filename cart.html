<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volt Tech - Корзина</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=15">
</head>

<body>
    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <img src="img/logo.png" alt="TechStore" class="logo-icon-img">
                Volt Tech
            </a>
            <nav>
                <ul class="flex gap-4">
                    <li><a href="index.html" class="nav-link">Главная</a></li>
                    <li><a href="catalog.html" class="nav-link">Каталог</a></li>
                    <li><a href="builds.html" class="nav-link">Сборки</a></li>
                </ul>
            </nav>
            <div class="flex items-center gap-4">
                <a href="auth.html" class="nav-link">Войти</a>
                <a href="cart.html" class="cart-btn">
                    🛒
                    <span class="cart-badge" id="cart-count">0</span>
                </a>
            </div>
        </div>
    </header>

    <div class="container cart-page">
        <h1 style="margin-bottom: 2rem;">Корзина покупок</h1>

        <div class="cart-grid">
            <!-- Список товаров -->
            <div class="cart-items" id="cart-items-container">
                <p>Ваша корзина пуста.</p>
                <!-- Пример элемента корзины (для верстки) -->
                <!-- 
                <div class="cart-item">
                    <img src="https://placehold.co/100" alt="Product">
                    <div class="cart-item-info">
                        <h3>NVIDIA GeForce RTX 4080</h3>
                        <p style="color: var(--text-secondary);">Видеокарты</p>
                    </div>
                    <div class="quantity-controls">
                        <button class="qty-btn">-</button>
                        <span>1</span>
                        <button class="qty-btn">+</button>
                    </div>
                    <div style="margin-left: 2rem; font-weight: bold; color: var(--accent-primary);">1199.99 сом</div>
                </div> 
                -->
            </div>

            <!-- Итоги -->
            <div class="cart-summary">
                <div class="glass-panel" style="padding: 2rem;">
                    <h2 style="margin-bottom: 1.5rem;">Итоги заказа</h2>

                    <div class="flex justify-between" style="margin-bottom: 1rem;">
                        <span style="color: var(--text-secondary);">Подытог</span>
                        <span id="cart-subtotal">0.00 сом</span>
                    </div>
                    <div class="flex justify-between" style="margin-bottom: 1rem;">
                        <span style="color: var(--text-secondary);">Доставка</span>
                        <span>Бесплатно</span>
                    </div>

                    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 1.5rem 0;">

                    <div class="flex justify-between"
                        style="margin-bottom: 2rem; font-size: 1.25rem; font-weight: bold;">
                        <span>Итого</span>
                        <span id="cart-total">0.00 сом</span>
                    </div>

                    <button class="btn btn-primary" style="width: 100%;">Перейти к оформлению</button>
                    <div class="text-center" style="margin-top: 1rem;">
                        <a href="catalog.html" style="font-size: 0.9rem; color: var(--text-secondary);">или Продолжить
                            покупки</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/api.js"></script>
    <script type="module" src="js/main.js"></script>
</body>

</html>
