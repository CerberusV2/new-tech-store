<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111522"/>
      <stop offset="100%" stop-color="#090b12"/>
    </linearGradient>
    <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2236"/>
      <stop offset="100%" stop-color="#101420"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff006e"/>
      <stop offset="100%" stop-color="#9b00e8"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="50%" stop-color="#9ca3af"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="24" fill="url(#bgGrad)"/>

  <!-- Плата PCB -->
  <rect x="26" y="22" width="148" height="156" rx="10" fill="url(#pcbGrad)" stroke="#2e3856" stroke-width="2"/>

  <!-- Дорожки на плате -->
  <path d="M40 140 L70 140 L80 155 M140 120 L160 120 M90 40 L90 55" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.3" fill="none"/>

  <!-- Радиатор VRM слева (с RGB полосой) -->
  <rect x="34" y="34" width="24" height="68" rx="4" fill="#252c42" stroke="#3b4566" stroke-width="1.5"/>
  <path d="M40 40 L52 52 M40 58 L52 70 M40 76 L52 88" stroke="url(#neonPink)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Верхний радиатор VRM -->
  <rect x="64" y="30" width="52" height="18" rx="3" fill="#252c42" stroke="#3b4566" stroke-width="1.5"/>
  <line x1="70" y1="39" x2="110" y2="39" stroke="url(#neonCyan)" stroke-width="2" stroke-linecap="round"/>

  <!-- Сокет процессора -->
  <rect x="68" y="56" width="44" height="44" rx="5" fill="url(#metal)" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="75" y="63" width="30" height="30" rx="3" fill="#161b29" stroke="#00f0ff" stroke-width="1.2"/>
  <rect x="82" y="70" width="16" height="16" rx="2" fill="#26304a"/>

  <!-- Слоты оперативной памяти (4 шт) -->
  <g>
    <rect x="124" y="34" width="6" height="68" rx="2" fill="#101420" stroke="#00f0ff" stroke-width="1"/>
    <rect x="134" y="34" width="6" height="68" rx="2" fill="#101420" stroke="#3b4566" stroke-width="1"/>
    <rect x="144" y="34" width="6" height="68" rx="2" fill="#101420" stroke="#00f0ff" stroke-width="1"/>
    <rect x="154" y="34" width="6" height="68" rx="2" fill="#101420" stroke="#3b4566" stroke-width="1"/>
  </g>

  <!-- Слот PCIe 5.0 (армированный) -->
  <rect x="38" y="114" width="84" height="9" rx="2" fill="url(#metal)" stroke="#00f0ff" stroke-width="1.2" filter="url(#glow)"/>
  <!-- Второй слот PCIe -->
  <rect x="38" y="142" width="84" height="8" rx="2" fill="#161b29" stroke="#3b4566" stroke-width="1"/>

  <!-- Радиатор M.2 NVMe -->
  <rect x="44" y="127" width="66" height="11" rx="2" fill="#252c42" stroke="#475569" stroke-width="1"/>
  <text x="64" y="135" fill="#00f0ff" font-family="sans-serif" font-size="6" font-weight="bold">M.2 PCIe 5.0</text>

  <!-- Радиатор чипсета с неоновым логотипом -->
  <rect x="128" y="116" width="36" height="44" rx="5" fill="#20263b" stroke="url(#neonCyan)" stroke-width="1.5"/>
  <polygon points="146,126 156,138 146,150 136,138" fill="url(#neonPink)" filter="url(#glow)"/>

  <!-- Крепежные отверстия платы -->
  <circle cx="33" cy="29" r="2.5" fill="#9ca3af"/>
  <circle cx="167" cy="29" r="2.5" fill="#9ca3af"/>
  <circle cx="33" cy="171" r="2.5" fill="#9ca3af"/>
  <circle cx="167" cy="171" r="2.5" fill="#9ca3af"/>
</svg>
