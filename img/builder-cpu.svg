<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGradCpu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111522"/>
      <stop offset="100%" stop-color="#090b12"/>
    </linearGradient>
    <linearGradient id="substrateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d4f48"/>
      <stop offset="100%" stop-color="#072b28"/>
    </linearGradient>
    <linearGradient id="ihsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ca3af"/>
      <stop offset="45%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ff006e"/>
    </linearGradient>
    <filter id="neonFilter" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="24" fill="url(#bgGradCpu)"/>

  <!-- Внешние контакты / пины -->
  <g stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round">
    <!-- Верх -->
    <line x1="60" y1="24" x2="60" y2="36"/><line x1="76" y1="24" x2="76" y2="36"/>
    <line x1="92" y1="24" x2="92" y2="36"/><line x1="108" y1="24" x2="108" y2="36"/>
    <line x1="124" y1="24" x2="124" y2="36"/><line x1="140" y1="24" x2="140" y2="36"/>
    <!-- Низ -->
    <line x1="60" y1="164" x2="60" y2="176"/><line x1="76" y1="164" x2="76" y2="176"/>
    <line x1="92" y1="164" x2="92" y2="176"/><line x1="108" y1="164" x2="108" y2="176"/>
    <line x1="124" y1="164" x2="124" y2="176"/><line x1="140" y1="164" x2="140" y2="176"/>
    <!-- Лево -->
    <line x1="24" y1="60" x2="36" y2="60"/><line x1="24" y1="76" x2="36" y2="76"/>
    <line x1="24" y1="92" x2="36" y2="92"/><line x1="24" y1="108" x2="36" y2="108"/>
    <line x1="24" y1="124" x2="36" y2="124"/><line x1="24" y1="140" x2="36" y2="140"/>
    <!-- Право -->
    <line x1="164" y1="60" x2="176" y2="60"/><line x1="164" y1="76" x2="176" y2="76"/>
    <line x1="164" y1="92" x2="176" y2="92"/><line x1="164" y1="108" x2="176" y2="108"/>
    <line x1="164" y1="124" x2="176" y2="124"/><line x1="164" y1="140" x2="176" y2="140"/>
  </g>

  <!-- Текстолит процессора -->
  <rect x="36" y="36" width="128" height="128" rx="14" fill="url(#substrateGrad)" stroke="#00f0ff" stroke-width="2" filter="url(#neonFilter)"/>

  <!-- Золотой ключ в углу -->
  <polygon points="42,150 42,158 50,158" fill="#fbbf24"/>

  <!-- Металлическая крышка теплораспределителя (IHS) -->
  <path d="M56 48 H144 A8 8 0 0 1 152 56 V144 A8 8 0 0 1 144 152 H56 A8 8 0 0 1 48 144 V56 A8 8 0 0 1 56 48 Z" fill="url(#ihsGrad)" stroke="#ffffff" stroke-width="1"/>

  <!-- Внутренняя гравировка ядра -->
  <rect x="64" y="64" width="72" height="72" rx="8" fill="#141824" stroke="url(#cyanGlow)" stroke-width="2"/>

  <!-- Схема ядер внутри -->
  <g fill="#00f0ff" opacity="0.85">
    <rect x="74" y="74" width="22" height="14" rx="2"/>
    <rect x="104" y="74" width="22" height="14" rx="2"/>
    <rect x="74" y="93" width="22" height="14" rx="2" fill="#ff006e"/>
    <rect x="104" y="93" width="22" height="14" rx="2" fill="#ff006e"/>
    <rect x="74" y="112" width="52" height="12" rx="2"/>
  </g>
</svg>
