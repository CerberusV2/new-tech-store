<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volt Tech - Вход</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=16">
    <link rel="stylesheet" href="css/auth.css?v=16">
</head>

<body>
    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <img src="img/logo.png" alt="TechStore" class="logo-icon-img">
                Volt Tech
            </a>

            <nav>
                <ul class="flex gap-4">
                    <li><a href="index.html" class="nav-link">Главная</a></li>
                    <li><a href="catalog.html" class="nav-link">Каталог</a></li>
                    <li><a href="builds.html" class="nav-link">Сборки</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="auth-container">
        <div class="glass-panel auth-panel">
            <h2 class="auth-title text-gradient">С возвращением</h2>
            <p class="auth-subtitle" id="auth-subtitle">Войдите, чтобы получить доступ к аккаунту</p>

            <div class="auth-toggle">
                <button class="toggle-btn active" id="btn-login" onclick="toggleMode('login')">Вход</button>
                <button class="toggle-btn" id="btn-register" onclick="toggleMode('register')">Регистрация</button>
            </div>

            <form id="auth-form" novalidate>
                <div id="username-container" style="display: none;">
                    <div
                        style="text-align: left; margin-bottom: 0.5rem; font-size: 0.8rem; color: var(--text-secondary);">
                        Имя пользователя</div>
                    <input type="text" id="username" class="auth-input" placeholder="Иван">
                </div>

                <div style="text-align: left; margin-bottom: 0.5rem; font-size: 0.8rem; color: var(--text-secondary);">
                    Электронная почта</div>
                <input type="email" id="email" class="auth-input" placeholder="name@example.com">

                <div style="text-align: left; margin-bottom: 0.5rem; font-size: 0.8rem; color: var(--text-secondary);">
                    Пароль</div>
                <input type="password" id="password" class="auth-input" placeholder="••••••••">

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;" id="submit-btn">Войти</button>
            </form>

            <div id="auth-msg" style="margin-top: 1rem; color: var(--accent-primary); min-height: 20px;"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/auth.js"></script>
</body>

</html>
