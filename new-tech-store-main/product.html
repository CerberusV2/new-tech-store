<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volt Tech - Страница товара</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=20">
    <link rel="stylesheet" href="css/product.css?v=20">
</head>

<body>

    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <img src="img/logo.png" alt="TechStore" class="logo-icon-img">
                Volt Tech
            </a>

            <nav>
                <ul class="flex gap-4">
                    <li><a href="index.html" class="nav-link">Главная</a></li>
                    <li><a href="catalog.html" class="nav-link active">Каталог</a></li>
                    <li><a href="builds.html" class="nav-link">Сборки</a></li>
                </ul>
            </nav>

            <div class="flex items-center gap-4">
                <a href="auth.html" class="nav-link">Войти</a>
                <a href="cart.html" class="cart-btn">
                    🛒
                    <span class="cart-badge" id="cart-count">0</span>
                </a>
            </div>
        </div>
    </header>

    <div class="container product-page-wrapper">
        <!-- Хлебные крошки -->
        <nav class="breadcrumbs" id="breadcrumbs">
            <a href="index.html">Главная</a>
            <span class="breadcrumb-separator">›</span>
            <a href="catalog.html">Каталог</a>
        </nav>

        <!-- Детальная карточка товара -->
        <div id="product-detail">
            <div class="loading-spinner-wrap">
                <div class="loading-spinner"></div>
                <span>Загрузка информации о товаре...</span>
            </div>
        </div>

        <!-- Отзывы, оценки и вопросы о товаре -->
        <section id="product-feedback-section" class="feedback-section" style="display: none;">
            <div class="feedback-tabs">
                <button class="feedback-tab-btn active" id="tab-btn-reviews" onclick="window.switchFeedbackTab('reviews')">
                    ⭐ Отзывы покупателей <span class="tab-count-badge" id="reviews-count-badge">0</span>
                </button>
                <button class="feedback-tab-btn" id="tab-btn-questions" onclick="window.switchFeedbackTab('questions')">
                    ❓ Вопросы о товаре <span class="tab-count-badge" id="questions-count-badge">0</span>
                </button>
            </div>

            <!-- ВКЛАДКА 1: ОТЗЫВЫ И ОЦЕНКИ -->
            <div id="feedback-tab-reviews" class="feedback-tab-content active">
                <div class="reviews-layout">
                    <!-- Левая колонка: Сводка рейтинга + Форма отзыва -->
                    <div class="reviews-sidebar">
                        <div class="rating-summary-card glass-panel" id="rating-summary-box"></div>

                        <div class="review-form-card glass-panel" id="add-review-box">
                            <h3 style="margin-bottom: 1rem;">Оставить отзыв</h3>
                            <form id="review-form" novalidate>
                                <div class="form-group" style="margin-bottom: 1rem;">
                                    <label class="form-label">Ваша оценка</label>
                                    <div class="star-rating-picker" id="star-picker">
                                        <button type="button" class="star-pick-btn active" data-val="1">★</button>
                                        <button type="button" class="star-pick-btn active" data-val="2">★</button>
                                        <button type="button" class="star-pick-btn active" data-val="3">★</button>
                                        <button type="button" class="star-pick-btn active" data-val="4">★</button>
                                        <button type="button" class="star-pick-btn active" data-val="5">★</button>
                                        <span class="star-pick-label" id="star-pick-label">5 из 5</span>
                                    </div>
                                    <input type="hidden" id="review-rating" value="5">
                                </div>

                                <div class="form-group" style="margin-bottom: 1rem;">
                                    <label class="form-label" for="review-author">Ваше имя *</label>
                                    <input type="text" id="review-author" class="form-input" placeholder="Александр">
                                </div>

                                <div class="form-group" style="margin-bottom: 1rem;">
                                    <label class="form-label" for="review-pros">Достоинства</label>
                                    <input type="text" id="review-pros" class="form-input" placeholder="Что вам понравилось?">
                                </div>

                                <div class="form-group" style="margin-bottom: 1rem;">
                                    <label class="form-label" for="review-cons">Недостатки</label>
                                    <input type="text" id="review-cons" class="form-input" placeholder="Что можно улучшить?">
                                </div>

                                <div class="form-group" style="margin-bottom: 1.25rem;">
                                    <label class="form-label" for="review-text">Комментарий *</label>
                                    <textarea id="review-text" class="form-input" rows="3" placeholder="Поделитесь впечатлениями о работе комплектующего..."></textarea>
                                </div>

                                <button type="submit" class="btn btn-primary" style="width: 100%;">Опубликовать отзыв</button>
                            </form>
                        </div>
                    </div>

                    <!-- Правая колонка: Список отзывов -->
                    <div class="reviews-list" id="reviews-list"></div>
                </div>
            </div>

            <!-- ВКЛАДКА 2: ВОПРОСЫ И ОТВЕТЫ -->
            <div id="feedback-tab-questions" class="feedback-tab-content" style="display: none;">
                <div class="questions-layout">
                    <div class="glass-panel" style="padding: 1.75rem; height: fit-content;" id="ask-question-box">
                        <h3 style="margin-bottom: 0.5rem;">Задать вопрос о товаре</h3>
                        <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.25rem;">
                            Специалисты Volt Tech ответят по совместимости, гарантии и характеристикам.
                        </p>
                        <form id="question-form" novalidate>
                            <div class="form-group" style="margin-bottom: 1rem;">
                                <label class="form-label" for="question-author">Ваше имя *</label>
                                <input type="text" id="question-author" class="form-input" placeholder="Ваше имя">
                            </div>
                            <div class="form-group" style="margin-bottom: 1.25rem;">
                                <label class="form-label" for="question-text">Ваш вопрос *</label>
                                <textarea id="question-text" class="form-input" rows="3" placeholder="Например: Подойдет ли к блоку питания 650W?"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary" style="width: 100%;">Отправить вопрос</button>
                        </form>
                    </div>

                    <div class="questions-list" id="questions-list"></div>
                </div>
            </div>
        </section>

        <!-- Похожие товары -->
        <section id="related-products" class="related-products" style="display: none;">
            <h2 class="related-title">Похожие товары</h2>
            <div class="products-grid" id="related-grid"></div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/api.js"></script>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/product-page.js"></script>
</body>

</html>
