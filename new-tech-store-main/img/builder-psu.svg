<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGradPsu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111522"/>
      <stop offset="100%" stop-color="#090b12"/>
    </linearGradient>
    <linearGradient id="psuBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#252c40"/>
      <stop offset="100%" stop-color="#121622"/>
    </linearGradient>
    <linearGradient id="goldBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="psuGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="24" fill="url(#bgGradPsu)"/>

  <!-- Корпус блока питания -->
  <rect x="24" y="38" width="152" height="124" rx="12" fill="url(#psuBox)" stroke="#3b4566" stroke-width="2"/>

  <!-- Решетка вентилятора слева -->
  <g transform="translate(80, 100)">
    <circle cx="0" cy="0" r="42" fill="#0b0d14" stroke="#00f0ff" stroke-width="1.5" filter="url(#psuGlow)"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#334155" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#334155" stroke-width="1.5"/>
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#334155" stroke-width="1.5"/>
    <line x1="0" y1="-40" x2="0" y2="40" stroke="#334155" stroke-width="1.5"/>
    <line x1="-28" y1="-28" x2="28" y2="28" stroke="#334155" stroke-width="1.5"/>
    <line x1="28" y1="-28" x2="-28" y2="28" stroke="#334155" stroke-width="1.5"/>
    <!-- Центр вентилятора с молнией -->
    <circle cx="0" cy="0" r="13" fill="#161925" stroke="#00f0ff" stroke-width="1.5"/>
    <polygon points="2,-7 -5,1 0,1 -2,7 5,-1 0,-1" fill="#fbbf24"/>
  </g>

  <!-- Правая панель: сертификат 80+ GOLD и модульные разъемы -->
  <rect x="132" y="52" width="34" height="22" rx="4" fill="url(#goldBadge)"/>
  <text x="137" y="64" fill="#000000" font-family="sans-serif" font-size="9" font-weight="900">80+</text>
  <text x="136" y="71" fill="#000000" font-family="sans-serif" font-size="6.5" font-weight="800">GOLD</text>

  <!-- Разъемы модульных кабелей -->
  <g fill="#090b12" stroke="#00f0ff" stroke-width="1">
    <rect x="134" y="84" width="30" height="12" rx="2"/>
    <rect x="134" y="102" width="30" height="12" rx="2"/>
    <rect x="134" y="120" width="13" height="12" rx="2" stroke="#ff006e"/>
    <rect x="151" y="120" width="13" height="12" rx="2" stroke="#ff006e"/>
  </g>

  <!-- Нижняя неоновая полоса -->
  <line x1="36" y1="152" x2="164" y2="152" stroke="#00f0ff" stroke-width="2" stroke-linecap="round"/>
</svg>
