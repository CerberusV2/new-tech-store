<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGradRam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111522"/>
      <stop offset="100%" stop-color="#090b12"/>
    </linearGradient>
    <linearGradient id="rgbBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff006e"/>
    </linearGradient>
    <linearGradient id="heatsinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27304a"/>
      <stop offset="100%" stop-color="#131826"/>
    </linearGradient>
    <filter id="ramGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="24" fill="url(#bgGradRam)"/>

  <!-- Модуль RAM 1 (верхний) -->
  <g transform="translate(0, -24)">
    <!-- RGB гребень -->
    <polygon points="24,78 34,68 166,68 176,78" fill="url(#rgbBar)" filter="url(#ramGlow)"/>
    <!-- Радиатор -->
    <rect x="20" y="78" width="160" height="38" rx="4" fill="url(#heatsinkGrad)" stroke="#3b4566" stroke-width="1.5"/>
    <!-- Геометрический узор радиатора -->
    <path d="M32 86 L55 86 L45 108 L28 108 Z" fill="#1e253a"/>
    <path d="M145 86 L168 86 L172 108 L155 108 Z" fill="#1e253a"/>
    <text x="74" y="101" fill="#00f0ff" font-family="sans-serif" font-size="11" font-weight="800" letter-spacing="1">DDR5 RGB</text>
    <!-- Золотые контакты -->
    <rect x="26" y="116" width="68" height="7" rx="1" fill="#064e3b"/>
    <line x1="28" y1="120" x2="92" y2="120" stroke="#fbbf24" stroke-width="5" stroke-dasharray="2.5 1.5"/>
    <rect x="102" y="116" width="72" height="7" rx="1" fill="#064e3b"/>
    <line x1="104" y1="120" x2="172" y2="120" stroke="#fbbf24" stroke-width="5" stroke-dasharray="2.5 1.5"/>
  </g>

  <!-- Модуль RAM 2 (нижний) -->
  <g transform="translate(0, 42)">
    <!-- RGB гребень -->
    <polygon points="24,78 34,68 166,68 176,78" fill="url(#rgbBar)" filter="url(#ramGlow)"/>
    <!-- Радиатор -->
    <rect x="20" y="78" width="160" height="38" rx="4" fill="url(#heatsinkGrad)" stroke="#3b4566" stroke-width="1.5"/>
    <path d="M32 86 L55 86 L45 108 L28 108 Z" fill="#1e253a"/>
    <path d="M145 86 L168 86 L172 108 L155 108 Z" fill="#1e253a"/>
    <text x="74" y="101" fill="#ff006e" font-family="sans-serif" font-size="11" font-weight="800" letter-spacing="1">DDR5 RGB</text>
    <!-- Золотые контакты -->
    <rect x="26" y="116" width="68" height="7" rx="1" fill="#064e3b"/>
    <line x1="28" y1="120" x2="92" y2="120" stroke="#fbbf24" stroke-width="5" stroke-dasharray="2.5 1.5"/>
    <rect x="102" y="116" width="72" height="7" rx="1" fill="#064e3b"/>
    <line x1="104" y1="120" x2="172" y2="120" stroke="#fbbf24" stroke-width="5" stroke-dasharray="2.5 1.5"/>
  </g>
</svg>
